name: Deploy

# 운영 서버(EC2)에 SSH 로 접속해 백엔드와 모니터링을 갱신한다. 두 가지로 쓴다.
#   1) 자동: main 푸시 뒤 release.yml 이 테스트와 이미지 빌드가 성공한 다음 이 워크플로를 호출한다 (backend_tag 는 그 커밋의 sha 태그).
#   2) 수동: Actions 탭 > Deploy > Run workflow. 이전 버전으로 되돌릴 때 backend_tag 에 이전 sha-xxxxxxx 를 넣는다.
# 프론트는 pAIr-front 저장소가 같은 서버의 frontend 컨테이너만 따로 갱신한다. 두 배포는 서버의 잠금(flock)으로 한 번에 하나씩 돈다.
#
# 하는 일: docker-compose.prod.yml, monitoring/, application-secret.yml(시크릿 APP_SECRET_YML), .env(Grafana 비밀번호)를 서버의
#          incoming/ 에 올린 뒤, 잠금을 잡고 제자리에 옮기고 → GHCR 로그인 → backend 이미지 pull →
#          backend, prometheus, grafana 를 새로 만든다 (설정 파일이 바뀌면 컨테이너를 다시 만들어야 읽는다). 마지막에 지표 포트로 상태를 확인한다.
#
# 필요한 설정 (저장소 Settings):
#   Environments > production 을 만들고 Deployment branches 를 main 만 허용한다. 승인자(Required reviewers)는 선택이다.
#   production 환경의 Secrets:
#     EC2_HOST         서버 주소 (탄력적 IP). known hosts 이름과 같아야 하므로 IP 로 쓴다
#     EC2_USER         SSH 사용자 (Ubuntu 이미지는 ubuntu)
#     EC2_SSH_KEY      SSH 개인 키 전체 (-----BEGIN ... 부터 끝까지)
#     EC2_KNOWN_HOSTS  서버 호스트 키 한 줄. `ssh-keyscan -t ed25519 <주소>` 결과에서 # 로 시작하지 않는 줄
#     APP_SECRET_YML   서버의 application-secret.yml 전체 내용
#     GRAFANA_ADMIN_PASSWORD  Grafana 관리자(admin) 비밀번호. 영문·숫자만 쓴다 (.env 에서 $ 나 따옴표가 있으면 값이 바뀐다). 충분히 길게 정한다
#   GHCR 패키지 접근: pair-front 는 pAIr-front 저장소가 올린 패키지라, 이 저장소의 GITHUB_TOKEN 으로 받으려면
#   패키지 설정(Package settings > Manage Actions access)에서 pAIr-back 저장소를 Read 로 추가하거나, 패키지를 Public 으로 바꾼다.
on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: '백엔드 이미지 태그 (latest 또는 sha-xxxxxxx)'
        default: latest
        required: true
  workflow_call:
    inputs:
      backend_tag:
        type: string
        default: latest

# 배포가 겹치지 않게 순서대로 하나씩 돌린다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Only main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::배포는 main 에서만 실행한다 (현재 ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4

      # Windows 에서 붙여 넣은 값에 섞이는 \r(CRLF)을 지운다. known hosts 는 EC2_HOST 이름으로 다시 쓴다 (이름이 달라서 못 찾는 일을 막는다)
      - name: SSH setup
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' | grep -v '^#' \
            | awk -v h="$EC2_HOST" 'NF>=3 {print h, $2, $3}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::EC2_KNOWN_HOSTS 에서 호스트 키 줄을 찾지 못했습니다"; exit 1; }

      - name: Upload files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_SECRET_YML: ${{ secrets.APP_SECRET_YML }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes $EC2_USER@$EC2_HOST"
          # 서버의 incoming/ 에 먼저 올린다. 제자리로 옮기는 일은 아래 단계에서 잠금을 잡고 한 번에 한다
          $SSH 'rm -rf ~/pair/incoming && mkdir -p ~/pair/incoming ~/pair/data'
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            docker-compose.prod.yml "$EC2_USER@$EC2_HOST:pair/incoming/docker-compose.yml"
          tar -cf - monitoring | $SSH 'cd ~/pair/incoming && tar -xf -'
          # 비밀값은 명령줄이 아니라 표준 입력으로 보낸다. 나만 읽을 수 있게 권한을 제한한다
          printf '%s\n' "$APP_SECRET_YML" | $SSH 'umask 077 && cat > ~/pair/incoming/application-secret.yml'
          # compose 가 같은 폴더의 .env 를 읽는다. 값이 한 줄이 되도록 줄바꿈 없이 쓴다
          printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD" | $SSH 'umask 077 && cat > ~/pair/incoming/.env'
          # 이 실행이 끝나면 만료되는 토큰. 서버에서 GHCR 로그인에만 쓰고 바로 지운다
          printf '%s' "$GHCR_TOKEN" | $SSH 'umask 077 && cat > ~/pair/incoming/ghcr_token'

      - name: Apply on server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          GHCR_USER: ${{ github.actor }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes $EC2_USER@$EC2_HOST"
          # 프론트 배포와 겹치지 않게 서버에서 잠금(flock)을 잡고 실행한다 (최대 15분 기다림)
          $SSH "BACKEND_TAG='$BACKEND_TAG' GHCR_USER='$GHCR_USER' flock -w 900 \$HOME/pair/.deploy.lock bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/pair
          docker login ghcr.io -u "$GHCR_USER" --password-stdin < incoming/ghcr_token
          rm -f incoming/ghcr_token
          # 올려 둔 파일을 제자리로 옮긴다
          mv -f incoming/docker-compose.yml docker-compose.yml
          mv -f incoming/application-secret.yml application-secret.yml
          mv -f incoming/.env .env
          rm -rf monitoring && mv incoming/monitoring monitoring
          export BACKEND_TAG
          docker compose pull backend
          # 예전 구성의 frontend 가 서버의 80 포트를 잡고 있으면 Caddy 가 뜨지 못한다. 그때만(HTTPS 전환 첫 배포)
          # 지금 떠 있는 이미지 그대로 새 구성으로 다시 만들어 포트를 비운다
          FRONT_ID=$(docker compose ps -aq frontend)
          if [ -n "$FRONT_ID" ] && [ "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$FRONT_ID")" != 0 ]; then
            FRONT_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$FRONT_ID")
            FRONTEND_TAG="${FRONT_IMAGE##*:}" docker compose up -d --no-deps --force-recreate frontend
          fi
          # 없는 서비스(처음 배포 때의 frontend 등)만 만들고, 이미 떠 있는 것은 건드리지 않는다
          docker compose up -d --remove-orphans --no-recreate
          # 시크릿 파일과 모니터링 설정은 컨테이너를 새로 만들어야 읽는다. frontend 는 건드리지 않는다
          docker compose up -d --force-recreate --no-deps backend prometheus grafana
          docker logout ghcr.io || true
          docker image prune -f > /dev/null
          REMOTE

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes $EC2_USER@$EC2_HOST"
          # 백엔드는 시작하면서 DB 마이그레이션을 확인하므로 올라오기까지 시간이 걸린다 (최대 약 3분)
          # 컨테이너가 죽었다 살아나기를 반복하면(시작 오류) 끝까지 기다리지 않고 바로 실패로 끝낸다
          for i in $(seq 1 36); do
            if $SSH 'curl -fsS http://127.0.0.1:8181/actuator/health' 2>/dev/null | grep -q '"status":"UP"'; then
              echo "백엔드가 올라왔습니다"
              # Caddy 를 거쳐 HTTPS 로 확인한다. 처음 배포에서는 인증서 발급을 기다려야 해서 다시 시도한다
              $SSH 'curl -fsS -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors --resolve kosamigo.duckdns.org:443:127.0.0.1 https://kosamigo.duckdns.org/' \
                || { echo "::error::HTTPS 확인에 실패했습니다. 보안 그룹 80·443 과 'docker compose logs caddy' 를 확인하세요"; exit 1; }
              echo "프론트도 HTTPS 로 응답합니다"
              exit 0
            fi
            RESTARTS=$($SSH "docker inspect -f '{{.RestartCount}}' pair-backend-1" 2>/dev/null || echo 0)
            if [ "${RESTARTS:-0}" -ge 2 ]; then
              echo "::error::백엔드가 시작하다 계속 종료됩니다 (재시작 ${RESTARTS}회)"
              break
            fi
            sleep 5
          done
          echo "::error::백엔드가 올라오지 않았습니다. 서버에서 'cd ~/pair && docker compose logs --tail 100 backend' 로 확인하세요"
          $SSH 'cd ~/pair && docker compose ps && docker compose logs --tail 60 backend' || true
          exit 1
