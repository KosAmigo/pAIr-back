name: Backend Image

# main 에 병합되면 백엔드 도커 이미지를 만들어 GitHub 컨테이너 저장소(GHCR)에 올린다.
# 서버에 반영하는 일(pull 과 재시작)은 하지 않는다. 비밀값은 GITHUB_TOKEN 만 쓴다.
# main 이 아닌 브랜치에서 손으로 실행(workflow_dispatch)하면 latest 는 붙이지 않고 sha 태그만 올린다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 이미지 이름은 소문자여야 한다 (조직 이름 KosAmigo 를 그대로 쓸 수 없다)
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pair-back" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # 빌드 컨텍스트는 backend/ 이고 Dockerfile 은 docker/ 에 있다 (docker-compose.yml 의 backend 서비스와 같다)
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
