name: Backend CI

# 전체 테스트(./gradlew build)를 클라우드에서 돌린다. 비밀값은 필요 없다(테스트는 H2 + AI 키 비움).
on:
  push:
    branches: [develop]
  workflow_dispatch:

# 같은 브랜치에서 실행이 쌓이면 이전 실행은 취소한다.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (전체 테스트 + 패키지 구조 검사)
        run: ./gradlew build -PfullTest --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore
