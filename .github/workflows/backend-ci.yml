name: Backend CI

# 전체 테스트(./gradlew build)를 클라우드에서 돌린다. 비밀값은 필요 없다(테스트는 H2 + AI 키 비움).
# main 푸시는 release.yml 이 이 워크플로를 호출해서 돌린다 (테스트가 통과해야 이미지 빌드와 배포로 넘어간다).
# 그래서 main 은 여기서 따로 돌리지 않는다. 같은 테스트가 두 번 도는 것을 막는다.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

# 같은 브랜치에서 실행이 쌓이면 이전 실행은 취소한다.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (전체 테스트 + 패키지 구조 검사)
        run: ./gradlew build -PfullTest --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore
