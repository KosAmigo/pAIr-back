plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pair'
version = '0.0.1-SNAPSHOT'
description = 'pAIr pilot backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Spring Boot 3.5 를 지원하는 Spring AI 1.1 계열의 최신 패치 (2026-06 릴리스)
    springAiVersion = '1.1.8'
}
// Boot 3.5.8 기본 Flyway(11.7.2)는 PostgreSQL 17까지만 알아 RDS(18.x)에서 경고가 난다. 같은 11 계열 최신으로 올린다(12 이상은 Boot 3.5 와 안 맞을 수 있음)
ext['flyway.version'] = '11.20.3'

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom 'software.amazon.awssdk:bom:2.33.4'
    }
}

// PDFBox·AWS SDK(HttpClient)가 commons-logging.jar 를 끌고 오는데, Spring 의 spring-jcl 과 겹쳐 실행 때 경고가 난다.
// spring-jcl 이 같은 API 를 주므로 진짜 jar 는 뺀다.
configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    // 엔티티의 getter, 기본 생성자 보일러플레이트 제거 (엔티티에는 @Getter, @NoArgsConstructor 만 쓴다)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 회원 비밀번호를 BCrypt 로 안전하게 해시하기 위해 사용한다.
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // 실전 시험 회차 (팀원 4): 회차·대상자·감독 이벤트는 PostgreSQL 에 저장. 스키마는 Flyway 마이그레이션으로 관리
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // 초대 메일 (개발 중에는 docker-compose 의 Mailpit 이 받는다)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 회차 결과·대상자 양식을 꾸민 엑셀(.xlsx)로 내보내고 읽는다
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    // 감독 사진 파일 서버 (S3). pair.exam.snapshot-storage=s3 일 때만 쓴다
    implementation 'software.amazon.awssdk:s3'

    // AI 과제 생성: 비개발 자료 문서를 PDF 로 만든다 (한글 글꼴 Pretendard 는 resources/fonts, OFL)
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'

    // AI 어시스턴트와 OpenAI 채점 (Spring AI OpenAI), Claude 채점 (Spring AI Anthropic)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // 응시자 코드의 JUnit 테스트를 별도 JVM에서 실행할 때 쓰는 콘솔 런처 (Boot 가 관리하는 JUnit 과 버전을 맞춤)
    implementation 'org.junit.platform:junit-platform-console-standalone:1.12.2' // Boot 3.5.8 의 JUnit Jupiter 5.12.2 와 짝

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 회차 테스트용 메모리 DB (PostgreSQL 호환 모드). Docker 없이 돌아간다
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    // 응시 데이터는 저장소 루트의 pilot-data/ 에 쌓는다 (.gitignore 처리됨)
    workingDir = rootProject.projectDir.parentFile
}
