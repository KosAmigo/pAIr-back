plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pair'
version = '0.0.1-SNAPSHOT'
description = 'pAIr pilot backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Spring Boot 3.5 를 지원하는 Spring AI 1.1 계열의 최신 패치 (2026-06 릴리스)
    springAiVersion = '1.1.8'
}
// Boot 3.5.8 기본 Flyway(11.7.2)는 PostgreSQL 17까지만 알아 RDS(18.x)에서 경고가 난다. 같은 11 계열 최신으로 올린다(12 이상은 Boot 3.5 와 안 맞을 수 있음)
ext['flyway.version'] = '11.20.3'

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom 'software.amazon.awssdk:bom:2.33.4'
    }
}

// PDFBox·AWS SDK(HttpClient)가 commons-logging.jar 를 끌고 오는데, Spring 의 spring-jcl 과 겹쳐 실행 때 경고가 난다.
// spring-jcl 이 같은 API 를 주므로 진짜 jar 는 뺀다.
configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    // 엔티티의 getter, 기본 생성자 보일러플레이트 제거 (엔티티에는 @Getter, @NoArgsConstructor 만 쓴다)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 휴대폰 보조 캠 JPEG 프레임 중계 (/ws/proctor). 서버는 분석하지 않고 최신 프레임만 응시자 PC 로 넘긴다
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 회원 비밀번호를 BCrypt 로 안전하게 해시하기 위해 사용한다.
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // 실전 시험 회차 (팀원 4): 회차·대상자·감독 이벤트는 PostgreSQL 에 저장. 스키마는 Flyway 마이그레이션으로 관리
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // 초대 메일 (개발 중에는 docker-compose 의 Mailpit 이 받는다)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 회차 결과·대상자 양식을 꾸민 엑셀(.xlsx)로 내보내고 읽는다
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    // 감독 사진 파일 서버 (S3). pair.exam.snapshot-storage=s3 일 때만 쓴다
    implementation 'software.amazon.awssdk:s3'

    // AI 과제 생성: 비개발 자료 문서를 PDF 로 만든다 (한글 글꼴 Pretendard 는 resources/fonts, OFL)
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'

    // AI 어시스턴트와 OpenAI 채점 (Spring AI OpenAI), Claude 채점 (Spring AI Anthropic)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // 응시자 코드의 JUnit 테스트를 별도 JVM에서 실행할 때 쓰는 콘솔 런처 (Boot 가 관리하는 JUnit 과 버전을 맞춤)
    implementation 'org.junit.platform:junit-platform-console-standalone:1.12.2' // Boot 3.5.8 의 JUnit Jupiter 5.12.2 와 짝

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 회차 테스트용 메모리 DB (PostgreSQL 호환 모드). Docker 없이 돌아간다
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 패키지 구조·이름 규칙 검사(ArchitectureTest)만 돌린다. 규칙은 global/config/PackageRules 에 있다.
// build 는 test 로, bootRun·bootJar 는 아래 dependsOn 으로 이 검사를 거친다.
def archTest = tasks.register('archTest', Test) {
    description = '패키지 구조·클래스 이름 규칙 검사'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.pair.ArchitectureTest' }
    // 실패하면 어긴 클래스 목록을 콘솔에 그대로 보여 준다
    testLogging { exceptionFormat = 'full'; events 'failed' }
}

// 컴파일 직후 같은 규칙(PackageRules.main)을 돌린다. classes 가 이 태스크를 거치므로
// IntelliJ 기본 설정(Build and run using: Gradle)에서 PairApplication 을 실행해도 빌드 단계에서 멈춘다.
// classpath 에 sourceSets.main.output 을 쓰면 classes 에 의존해 순환이 생기므로 컴파일 결과 폴더를 직접 넣는다.
def packageRulesCheck = tasks.register('packageRulesCheck', JavaExec) {
    description = '패키지 구조·클래스 이름 규칙 검사 (컴파일 직후)'
    group = 'verification'
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    mainClass = 'com.pair.global.config.PackageRules'
    classpath = files(tasks.named('compileJava').map { it.destinationDirectory },
            tasks.named('processResources').map { it.destinationDir }) + configurations.runtimeClasspath
    // 한글 메시지가 깨지지 않게 출력은 UTF-8 로
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    // 코드가 바뀌지 않았으면 다시 돌지 않는다 (통과하면 표시 파일을 남김)
    def marker = layout.buildDirectory.file('package-rules/passed')
    inputs.files(classpath)
    outputs.file(marker)
    doLast { marker.get().asFile.text = 'ok' }
}

tasks.named('classes') {
    dependsOn packageRulesCheck
}

tasks.named('bootJar') {
    dependsOn archTest
}

tasks.named('bootRun') {
    dependsOn archTest
    // 응시 데이터는 저장소 루트의 pilot-data/ 에 쌓는다 (.gitignore 처리됨)
    workingDir = rootProject.projectDir.parentFile
}
