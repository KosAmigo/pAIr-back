server:
  port: 8180
  # 안전한 종료: 종료 신호(SIGTERM)를 받으면 새 요청은 받지 않고, 처리 중인 요청은 timeout-per-shutdown-phase 까지 끝내게 둔다.
  # 그 뒤 채점(ScoringService, ScoringWorkerService)이 pair.scoring.shutdown-wait 까지 마저 끝낸다.
  # 둘을 더한 시간보다 Docker 의 stop_grace_period(docker-compose.prod.yml)가 길어야 강제 종료(SIGKILL)되지 않는다
  shutdown: graceful

# 모니터링 (Prometheus + Grafana). 지표는 사용자용 포트(8180)와 분리한 관리 포트에서만 연다.
# 운영에서는 이 포트를 보안 그룹·방화벽으로 내부망에만 열어야 한다 (지표에 내부 상태가 드러난다).
management:
  server:
    port: ${PAIR_MANAGEMENT_PORT:8181}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # 채점 큐가 꺼져 있으면(기본·테스트) redis 점검 빈이 없어서, 아래 exclude: redis 가 "없는 점검"이라며 시작을 막는다. 검사를 끈다
      validate-group-membership: false
      group:
        # 배포 확인(deploy.yml)이 보는 핵심 상태: Redis 를 뺀 전부(DB, 디스크 등). /actuator/health/core
        # Redis(채점 큐)가 잠깐 죽어도 제출·채점은 서버 안에서 계속되므로 배포를 막지 않는다. 전체 /actuator/health 는 Redis 까지 본다
        core:
          include: "*"
          exclude: redis
  health:
    # /health 를 부를 때마다 SMTP 서버에 접속하지 않는다. 테스트에서는 메일 발송기가 가짜라 이 점검 빈이 만들어지지도 않는다
    mail:
      enabled: false
    # Redis 는 채점 큐를 켰을 때만 쓴다. 꺼져 있을 때(기본)는 Redis 가 없어도 /health 가 DOWN 이 되지 않게 점검하지 않는다
    redis:
      enabled: ${PAIR_SCORING_QUEUE_ENABLED:false}
  metrics:
    tags:
      application: pair-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: pair-backend
  lifecycle:
    timeout-per-shutdown-phase: ${PAIR_SHUTDOWN_TIMEOUT:30s}
  # 비밀번호·API 키는 저장소 루트(pAIr-back)의 application-secret.yml 에 둔다 (.gitignore 처리, 커밋 금지).
  # 키 이름: PAIR_DB_PASSWORD, OPENAI_API_KEY, ANTHROPIC_API_KEY (PAIR_DB_URL, PAIR_DB_USER 로 주소·계정도 바꿀 수 있다)
  # bootRun 은 pAIr-back 에서, IDE 는 backend 에서 실행될 수 있어 두 위치를 모두 본다
  config:
    import:
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
  # DB 는 AWS RDS(PostgreSQL). 비밀번호가 없으면 서버가 켜지지 않는다
  datasource:
    url: ${PAIR_DB_URL:jdbc:postgresql://pair-db.c9806yki8nbh.ap-northeast-2.rds.amazonaws.com:5432/pair}
    username: ${PAIR_DB_USER:postgres}
    password: ${PAIR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 다르면 서버가 켜지지 않는다
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # RDS 는 ERD(V1)로 먼저 만들어져 있어 Flyway 기록이 없다. 비어 있지 않은 DB 는 V1 까지 적용된 것으로 표시하고 V2 부터 적용한다.
    # 빈 DB 에서는 V1 부터 차례로 적용한다
    baseline-on-migrate: true
    baseline-version: 1
    # 파일 번호는 공유 RDS 의 flyway_schema_history 와 맞춘다(V6 email verifications, V9 task content, V10 prompt versions, V11 connection grace).
    # 번호가 이미 RDS 에 들어간 파일은 이름을 바꾸지 않는다. 팀원 로컬 DB 에만 있는 옛 번호는 검증에서 무시한다
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${PAIR_REDIS_HOST:localhost}
      port: ${PAIR_REDIS_PORT:6379}
      # JPA 만 쓴다. Redis 저장소 자동 설정은 켜지 않는다
      repositories:
        enabled: false
  mail:
    host: ${PAIR_MAIL_HOST:localhost}
    port: ${PAIR_MAIL_PORT:1025}
    # 실제 SMTP(Gmail 앱 비밀번호, SES 등)를 쓸 때만 환경 변수로 넣는다. 비우면 Mailpit 처럼 인증 없이 보낸다
    username: ${PAIR_MAIL_USERNAME:}
    password: ${PAIR_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${PAIR_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${PAIR_MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  ai:
    # API 키: 값은 여기 쓰지 않는다. 시스템 환경 변수를 가리키기만 한다.
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    # Spring AI 자동 설정 모델은 쓰지 않는다. 자동 설정은 기본 temperature(0.7, 0.8)를 넣는데
    # 최신 추론 모델은 temperature 를 받지 않아서, 모델은 코드(com.pair.infra.ai.SpringAi)에서 빌더로 만든다.
    # 키가 없을 때 서버가 아예 안 켜지는 것도 막는다(키가 없으면 그 기능을 쓸 때만 오류).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

# 서버 시작 때 패키지 구조·이름 규칙 검사 (global/config/PackageRulesConfig). 운영 서버에서는 PACKAGE_RULES_ENABLED=false
package-rules:
  enabled: ${PACKAGE_RULES_ENABLED:true}

pair:
  # 이 서버의 환경 이름. 공용 DB 의 AI 과제 생성 작업(task_gen_jobs.env)을 서버별로 나눈다: 서버는 자기 env 의 작업만 줍는다.
  # 운영은 PAIR_ENV_NAME=prod 로 정한다(docker-compose.prod.yml). 정하지 않으면 local-<컴퓨터 이름>(팀원 PC 의 OS 사용자 이름이 같을 수 있어 컴퓨터 이름을 쓴다)
  env-name: ${PAIR_ENV_NAME:local-${COMPUTERNAME:${HOSTNAME:dev}}}
  toss:
    # 테스트 키만 허용한다. 클라이언트 키는 프론트에서 별도로 설정한다.
    secret-key: ${PAIR_TOSS_SECRET_KEY:}
  # 신규 회원 지급 및 자가진단 응시·AI 질문·롤백 1회 비용 (실전 시험 제외).
  credit:
    signup: 200
    attempt: 10
    chat: 10
    attachment: 5      # 질문에 새로 붙인 첨부 파일 하나당 추가 차감
    rollback: 10

  # 실제 요청은 bearer JWT로 인증하며, 임의 사용자 헤더는 신뢰하지 않는다.
  auth:
    mode: bearer
    jwt:
      # Base64로 인코딩한 32바이트 이상의 무작위 서명 키. 운영 환경에서 반드시 제공한다.
      secret: ${PAIR_JWT_SECRET:}
    withdrawn-email:
      # 별도의 Base64 무작위 키(32바이트 이상). 변경하거나 잃으면 기존 탈퇴 회원을 식별할 수 없다.
      secret: ${PAIR_WITHDRAWN_EMAIL_SECRET:}
    email-from: ${PAIR_MAIL_FROM:no-reply@pair.test}
    email-verification:
      code-lifetime: 10m
      resend-interval: 60s
      max-attempts: 5
    # 로그인 실패 횟수 제한. 넘으면 window 가 지날 때까지 429
    login-limit:
      window: 10m
      per-email-and-ip: 5   # 한 곳에서 한 계정
      per-email: 20         # 여러 IP 에서 한 계정
      per-ip: 50            # 한 곳에서 여러 계정 (학원·회사처럼 IP 를 같이 쓰는 곳을 고려)
      trusted-proxy-hops: ${PAIR_TRUSTED_PROXY_HOPS:1} # 앞단 프록시 수. nginx 앞에 HTTPS 프록시를 더 두면 2
  # 로그인 없이 부를 수 있는 API 의 IP별 요청 수 제한. 넘으면 429 (학원·회사처럼 IP 를 같이 쓰는 곳을 고려)
  ip-limit:
    window: 1h
    mail: 40     # 인증 메일 요청
    signup: 60   # 가입, 초대 가입
    inquiry: 10  # 기업 도입 문의
  company:
    login-url: ${PAIR_COMPANY_LOGIN_URL:https://localhost:5173/login}
    invite-url: ${PAIR_COMPANY_INVITE_URL:https://localhost:5173/company-invite}
  # 응시 기록을 쌓는 폴더 (bootRun 은 저장소 루트에서 실행되므로 pAIr/pilot-data)
  data-dir: pilot-data

  # 실전 시험 회차 (팀원 4)
  exam:
    # 초대 메일 속 입장 링크 앞부분. 뒤에 /entry?invite={초대 토큰} 이 붙는다
    # 비워 두면 이 PC의 사내 IP 로 https://IP:5173 을 자동으로 쓴다 (개발). 배포에서는 서비스 주소를 넣는다
    entry-base-url: ${PAIR_ENTRY_BASE_URL:}
    # 실제 SMTP 는 보내는 주소가 계정과 같아야 하는 곳이 많다 (Gmail 등)
    mail-from: ${PAIR_MAIL_FROM:no-reply@pair.test}
    # 감독관 실시간 영상 보기 (WebRTC 시그널링). 꺼져 있으면 watch 를 error 로 거절한다. 켜려면 PAIR_LIVE_VIEW_ENABLED=true
    live-view-enabled: ${PAIR_LIVE_VIEW_ENABLED:false}
    # 종료 시각이 지난 회차를 찾아 자동 제출하는 주기
    auto-submit-interval-ms: 2000
    # 감독 사진·대상자 CSV 저장소: local = pilot-data/ 아래 (개발용), s3 = 운영
    snapshot-storage: ${PAIR_SNAPSHOT_STORAGE:local}
    # snapshot-storage=s3 일 때. 접근 키는 여기 쓰지 않는다 (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경 변수나 IAM 역할)
    s3:
      bucket: ${PAIR_S3_BUCKET:}
      region: ${PAIR_S3_REGION:ap-northeast-2}
      # 키에 폴더(exam-snapshots/, participant-csv/)가 들어 있어 비워 둔다
      prefix: ""
      endpoint: ${PAIR_S3_ENDPOINT:}
      # 로컬 개발용. 비우면 AWS 기본 방식(~/.aws, EC2 IAM 역할)을 씀. 값은 application-secret.yml에만, git에 넣지 말 것
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    # 감독 사진 보관 기간: 회차 종료 뒤 며칠. 지나면 파일을 지우고 snapshot_deleted_at 을 남긴다
    snapshot-retention-days: 7
    # 사진 1장 최대 크기 (cam-proctor 는 320px JPEG 로 보통 10~20KB)
    snapshot-max-bytes: 200000
    # CSV 한 번에 올릴 수 있는 대상자 수
    max-participants-per-upload: 1000

  # AI 과제 생성 (코드 기본값과 같은 값)
  taskgen:
    # 과제 PDF 저장소: local = pilot-data/ 아래(혼자 쓰는 로컬 DB용), s3 = 공용 RDS·배포
    # 따로 안 정하면 감독 사진 설정(PAIR_SNAPSHOT_STORAGE)을 따라간다
    # local 인데 DB 가 공용(원격)이면 비개발 과제 생성이 막힌다
    # s3 접속 값(bucket, region, endpoint)은 새로 만들지 않고 위의 pair.exam.s3.* 를 그대로 쓴다. 저장 키는 task-files/...
    file-storage: ${PAIR_TASKFILE_STORAGE:${PAIR_SNAPSHOT_STORAGE:local}}
    model: gpt-6.1-terra
    solver-model: claude-sonnet-5-5   # BIZ 직접 풀이 검사(생성 sol 과 다른 회사): claude-* 는 Anthropic, gpt-* 는 OpenAI
    solver-effort: medium
    max-concurrent: ${PAIR_TASKGEN_MAX_CONCURRENT:10}   # 동시에 도는 생성 작업 상한(최대 10). 넘으면 대기열에서 기다린다
    # 대기열 워커(5초마다 내 env 의 대기 작업을 집음). 끄면 이 서버는 작업을 줍지 않는다(요청은 받아 대기열에 넣는다)
    worker:
      enabled: ${PAIR_TASKGEN_WORKER_ENABLED:true}
    # 생성기 전용 코드 실행(응시용 pair.run.* 과 따로, 서버의 별도 JVM). 비우면 max-concurrent=CPU 수, timeout=pair.run.timeout-seconds, heap-mb=256
    run:
      heap-mb: 256            # 실행 JVM 하나의 -Xmx(MB). max-concurrent, timeout-seconds 를 쓰려면 여기에 적는다
    effort: medium
    max-tokens: 48000
    # 생성 방식: staged = 단계별(설계도 → 작성 → 코드/문항 글 → 정답 쪽 → 관문, pAIr-docs 설계/과제_생성_파이프라인.md), oneshot = 옛 방식(한 번에 과제 전체)
    pipeline: staged
    # staged 단계별 모델·추론 강도·출력 한도(생각 토큰 포함). 모델 이름이 claude-* 면 Anthropic, 아니면 OpenAI. 비우면 model 과 코드 기본값
    # 직군(dev, biz)마다 따로. 생성과 검사는 다른 회사 모델이 맡는다(DEV: Sonnet 이 만들고 sol 이 검사, BIZ: sol 이 만들고 Sonnet 이 검사)
    stages:
      dev:
        blueprint: {model: gpt-6.1-sol, effort: medium, max-tokens: 24000}
        writing: {model: gpt-6.1-sol, effort: low, max-tokens: 16000}   # 결함을 모르는 단계. 글로 옮기기만 해서 low(g5 08: medium 이 생각 16000 을 다 써 빈 답)
        code: {model: gpt-6.1-sol, effort: medium, max-tokens: 24000}
        answer: {model: gpt-6.1-sol, effort: medium, max-tokens: 32000}
        # 관문 검사(코드 검사를 통과한 과제에만). review 는 다른 풀이 작성도 맡고, review2 는 답 노출을 따로 보는 두 번째 눈
        review: {model: gpt-6.1-sol, effort: medium, max-tokens: 16000}   # 관문 평가에서 sol 이 오탐이 적음(테스트 근거 1 대 Sonnet 11)
        review2: {model: claude-sonnet-5-5, effort: medium, max-tokens: 16000}   # 답 노출 2차는 다른 회사
        # 단계 4' 관련 적은 자료(E6·M6): 결함과 상관없으니 싼 모델. filler-review 는 생성과 다른 회사 모델이 답·결함 근거·판단 근거가 섞였는지 본다
        filler: {model: gpt-6.1-terra, effort: low, max-tokens: 24000}
        filler-review: {model: claude-sonnet-5-5, effort: low, max-tokens: 6000}
      biz:
        blueprint: {model: gpt-6.1-sol, effort: medium, max-tokens: 24000}
        writing: {model: gpt-6.1-sol, effort: low, max-tokens: 16000}   # 결함을 모르는 단계(low: g5 02·08 빈 답)
        questions: {model: gpt-6.1-sol, effort: low, max-tokens: 8000}   # 문항 글(결함을 모르는 단계)
        answer: {model: gpt-6.1-sol, effort: medium, max-tokens: 32000}
        review: {model: claude-sonnet-5-5, effort: medium, max-tokens: 16000}
        review2: {model: gpt-6.1-terra, effort: medium, max-tokens: 16000}
        filler: {model: gpt-6.1-terra, effort: low, max-tokens: 24000}
        filler-review: {model: claude-sonnet-5-5, effort: low, max-tokens: 6000}
    # 과제 1개를 만드는 데 쓸 수 있는 비용 상한($, 모든 호출의 토큰×가격). 다음 다시 만들기가 넘기면 멈추고 검수 전(HIDDEN)으로 저장한다
    cost-cap: 0.6
    # 직군·제한시간별 상한(2026-11-26 사용자 결정, 파이프라인 문서 5장). BIZ 40·60분은 첫 시도만 $0.5~0.65라 0.6 이면 다시 만들 수 없었다(g9). 키가 없으면 cost-cap
    cost-caps: {dev: 0.6, biz-20: 0.6, biz-40: 0.8, biz-60: 1.0}
    # E6·M6: 필요한 묶음만 첨부하면 과제별 AI 제한 안에서 풀리고 자료 전체는 맥락 한도를 넘게 한다. 설계도가 묶음·관련 적은 자료 목록을 내고,
    # 단계 4'가 관련 적은 자료를 만들고, 관문이 분량(묶음 ≤ 한도의 70%, 전체 ≥ 한도의 2배)과 답 노출을 본다(기준 문서 좋은_과제_기준.md 6장)
    material-gate: true
    # 주제·함정 추천: 싼 모델, 짧은 출력. 추론 모델이라 생각 토큰도 상한에 들어간다
    suggest-model: gpt-6-luna   # 주제 추천만 예외로 luna(terra 는 low·8000 에서도 가끔 생각만 하다 잘림, g5). 다른 생성 단계는 terra 이상
    suggest-max-tokens: 2000
    # 답 노출 AI 판정(M5): 응시자에게 보이는 글이 결함의 원인·고치는 법·계산 절차를 알려 주는지 본다. 비우면 suggest-model
    leak-model: gpt-6.1-terra
    leak-max-tokens: 3000
    suggest-effort: low      # 추론 모델: minimal 은 400 오류일 수 있어 low 로 둔다
    # 참고 지표 "AI 단독 풀이"(개발 과제, 합격·불합격 아님): 응시자 AI 처럼 설명·보이는 파일만 주고 solo-attempts 번(기본 1) 풀게 해 숨은 결함을 잡았는지 기록만 한다
    # 모델·추론 강도·출력 한도는 응시자 AI 설정(pair.assistant)을 그대로 쓴다. 끄면 검사를 건너뛰고 report 에 "건너뜀"만 남는다
    solo-enabled: true
    solo-model: ${pair.assistant.model}
    solo-attempts: 1

  # 응시자가 쓰는 AI 어시스턴트.
  assistant:
    provider: openai
    model: gpt-6-luna
    # 추론(reasoning) 모델은 생각에 쓰는 토큰도 이 한도에 포함된다. 너무 작으면 답이 비어서 온다.
    max-output-tokens: 8000
    # 추론 강도: none, low, medium, high, xhigh (gpt-6 계열은 minimal 없음). 낮을수록 빠르고 싸며 한도에 덜 걸린다.
    reasoning-effort: low
    max-turns: 40
    # 응시자 질문 한 번의 최대 글자 수 (프론트 입력창 글자 수 표시와 같은 값)
    max-input-chars: 1000
    # 질문에 붙이는 첨부(파일 트리에서 끌어온 작업 파일·과제 PDF 쪽 글): 질문 1개당 파일 수·합계 글자 수,
    # 이후 질문에도 계속 보내는 첨부 본문의 응시 전체 합계(넘으면 오래된 첨부부터 한 줄 표지로 줄인다)
    max-attachments: 5
    max-attachment-chars: 30000
    max-attachment-context-chars: 100000
    system-prompt: >-
      당신은 개발 및 기획 과제를 돕는 AI 어시스턴트입니다.
      사용자가 대화에 직접 붙여 넣은 내용만 볼 수 있습니다.
      한국어로 간결하고 정확하게 답하세요.

  # 채점: 서로 다른 회사 모델로 채점한다. calls 는 채점 1건에 그 모델을 부르는 횟수.
  # Haiku 1번 + terra 2번, 세 판정의 다수결(가운데 값)로 감점한다. 한 번씩만 부르면 엇갈릴 때 절반 감점이 되어 총점이 흔들린다(기술검증 3번).
  judge:
    claude:
      model: claude-haiku-5-5      # 비용 우선. 더 정확하게 보려면 claude-sonnet-5-5
      effort: medium               # Spring AI 1.1 에 옵션이 없어 요청에 직접 넣음 (AnthropicEffortInterceptor)
      max-tokens: 16000
    openai:
      model: gpt-6.1-terra
      effort: medium
      max-tokens: 16000
      calls: 2
    # 비개발 채점의 제공 자료(토큰 절약):
    #   auto(기본) = 자료 전체 글자 수가 reference-docs-full-max-chars 이하면 full, 넘으면 rag
    #   full = 통째로. 응시와 상관없이 같은 글이라 프롬프트 캐시 앞부분에 넣어 3번 호출·연달아 들어오는 채점이 캐시를 같이 쓴다
    #   rag  = 제출물 문장으로 검색한 조각만(CSV 표는 통째로). 제출물마다 조각이 달라 캐시가 안 맞아 뒷부분에 넣는다
    reference-docs: ${PAIR_REFERENCE_DOCS:auto}
    reference-docs-full-max-chars: ${PAIR_REFERENCE_DOCS_FULL_MAX_CHARS:12000}

  # (예비) Claude 를 어시스턴트로 쓸 때의 모델. 이번 파일럿에서는 쓰지 않는다.
  claude-assistant-model: claude-haiku-5-5

  # 응시자 코드 테스트 실행
  run:
    # local(기본) = 이 서버의 JVM 에서 바로 실행. 격리가 없어 개발용으로만 쓴다
    # docker = 실행마다 격리 컨테이너(sh docker/sandbox/build.sh 로 pair-sandbox 이미지 필요). 앱과 샌드박스를 한 서버에 둘 때의 배포값
    # remote = 별도 샌드박스 서버에 맡김(아래 remote-url, remote-token). 앱 서버에는 DB·API 키가 있고 샌드박스 서버에는 없다
    mode: ${PAIR_RUN_MODE:local}
    timeout-seconds: 30
    docker-bin: docker
    docker-image: pair-sandbox
    max-concurrent: 4      # docker 모드에서 동시에 돌 컨테이너 수. 서버 코어 수 이하로 (넘으면 느려져 정상 코드도 시간 초과로 실패)
    queue-wait-seconds: 60 # 자리가 날 때까지 기다리는 최대 시간. 넘으면 실행을 거절한다
    rate-limit-per-minute: 10 # 응시자 1명(실전은 응시 1건)이 1분에 누를 수 있는 빌드·실행 횟수. 넘으면 429
    # remote = 실행을 별도 샌드박스 서버(실행 전용 API, 프로필 sandbox-server)에 맡긴다. 주소와 공유 토큰은 앱·샌드박스 서버가 같은 값을 쓴다
    remote-url: ${PAIR_RUN_REMOTE_URL:}
    remote-token: ${PAIR_RUN_REMOTE_TOKEN:}

  # 채점 툴 (메인 화면 오른쪽 위 아이콘). 프롬프트 버전과 샘플 응시는 grader/ 폴더로 git 공유.
  grader:
    dir: grader
    # 동시에 채점할 개수 (실제 응시 채점과 실험 채점이 함께 씀)
    parallel: 4
  # 채점 큐(Redis 스트림). 꺼져 있으면 서버 안의 스레드 풀이 바로 채점한다. 켜려면 PAIR_SCORING_QUEUE_ENABLED=true 와 Redis 가 필요하다
  # (docker compose --profile redis up -d). workers, max-attempts, retry-delay, stale-after 는 ScoringQueueProperties 참고
  scoring-queue:
    enabled: ${PAIR_SCORING_QUEUE_ENABLED:false}
  # 서버를 켤 때 SCORING 에 남은 응시(재시작으로 끊긴 채점)를 다시 채점에 맡긴다 (ScoringRecoveryService)
  scoring:
    recover-on-startup: ${PAIR_SCORING_RECOVER_ON_STARTUP:true}
    # 서버를 끌 때 하던 채점이 끝나기를 기다리는 최대 시간 (채점 1건은 보통 1분 안팎). 시작하지 않은 채점은 다음 시작 때 다시 맡긴다
    shutdown-wait: ${PAIR_SCORING_SHUTDOWN_WAIT:90s}

  # 다시 채점: 응시 하나를 24시간에 채점할 수 있는 횟수(첫 채점과 채점 큐의 자동 재시도 포함). 넘으면 429
  rescore:
    max-per-day: 10

  # 모델 가격 ($/1M 토큰, 입력/출력). 채점 툴의 예상 비용 계산용
  pricing:
    "[gpt-6-luna]": { input: 0.10, output: 0.50 }
    "[gpt-6.1-terra]": { input: 1.0, output: 5.0 }
    "[gpt-6.1-sol]": { input: 2.0, output: 10.0 }
    "[claude-haiku-5-5]": { input: 0.10, output: 0.50 }
    "[claude-sonnet-5-5]": { input: 2.0, output: 10.0 }
