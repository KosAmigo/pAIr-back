server:
  port: 8180

spring:
  application:
    name: pair-backend
  # 비밀번호·API 키는 저장소 루트(pAIr-back)의 application-secret.yml 에 둔다 (.gitignore 처리, 커밋 금지).
  # 키 이름: PAIR_DB_PASSWORD, OPENAI_API_KEY, ANTHROPIC_API_KEY (PAIR_DB_URL, PAIR_DB_USER 로 주소·계정도 바꿀 수 있다)
  # bootRun 은 pAIr-back 에서, IDE 는 backend 에서 실행될 수 있어 두 위치를 모두 본다
  config:
    import:
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
  # DB 는 AWS RDS(PostgreSQL). 비밀번호가 없으면 서버가 켜지지 않는다
  datasource:
    url: ${PAIR_DB_URL:jdbc:postgresql://pair-db.c9806yki8nbh.ap-northeast-2.rds.amazonaws.com:5432/pair}
    username: ${PAIR_DB_USER:postgres}
    password: ${PAIR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 다르면 서버가 켜지지 않는다
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # RDS 는 ERD(V1)로 먼저 만들어져 있어 Flyway 기록이 없다. 비어 있지 않은 DB 는 V1 까지 적용된 것으로 표시하고 V2 부터 적용한다.
    # 빈 DB 에서는 V1 부터 차례로 적용한다
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${PAIR_MAIL_HOST:localhost}
    port: ${PAIR_MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  ai:
    # API 키: 값은 여기 쓰지 않는다. 시스템 환경 변수를 가리키기만 한다.
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    # Spring AI 자동 설정 모델은 쓰지 않는다. 자동 설정은 기본 temperature(0.7, 0.8)를 넣는데
    # 최신 추론 모델은 temperature 를 받지 않아서, 모델은 코드(com.pair.ai.SpringAi)에서 빌더로 만든다.
    # 키가 없을 때 서버가 아예 안 켜지는 것도 막는다(키가 없으면 그 기능을 쓸 때만 오류).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

pair:
  # 응시 기록을 쌓는 폴더 (bootRun 은 저장소 루트에서 실행되므로 pAIr/pilot-data)
  data-dir: pilot-data

  # 실전 시험 회차 (팀원 4)
  exam:
    # 초대 메일 속 입장 링크 앞부분. 뒤에 /entry?invite={초대 토큰} 이 붙는다
    entry-base-url: ${PAIR_ENTRY_BASE_URL:http://localhost:5173}
    mail-from: no-reply@pair.test
    # 종료 시각이 지난 회차를 찾아 자동 제출하는 주기
    auto-submit-interval-ms: 2000
    # 감독 사진·대상자 CSV 저장소: local = pilot-data/ 아래 (개발용), s3 = 운영
    snapshot-storage: ${PAIR_SNAPSHOT_STORAGE:local}
    # snapshot-storage=s3 일 때. 접근 키는 여기 쓰지 않는다 (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경 변수나 IAM 역할)
    s3:
      bucket: ${PAIR_S3_BUCKET:}
      region: ${PAIR_S3_REGION:ap-northeast-2}
      # 키에 폴더(exam-snapshots/, participant-csv/)가 들어 있어 비워 둔다
      prefix: ""
      endpoint: ${PAIR_S3_ENDPOINT:}
    # 감독 사진 보관 기간: 회차 종료 뒤 며칠. 지나면 파일을 지우고 snapshot_deleted_at 을 남긴다
    snapshot-retention-days: 30
    # 사진 1장 최대 크기 (cam-proctor 는 320px JPEG 로 보통 10~20KB)
    snapshot-max-bytes: 200000
    # CSV 한 번에 올릴 수 있는 대상자 수
    max-participants-per-upload: 1000

  # 응시자가 쓰는 AI 어시스턴트.
  assistant:
    provider: openai
    model: gpt-6-luna
    # 추론(reasoning) 모델은 생각에 쓰는 토큰도 이 한도에 포함된다. 너무 작으면 답이 비어서 온다.
    max-output-tokens: 8000
    # 추론 강도: none, minimal, low, medium, high. 낮을수록 빠르고 싸며 한도에 덜 걸린다.
    reasoning-effort: low
    max-turns: 40
    # 응시자 질문 한 번의 최대 글자 수 (프론트 입력창 글자 수 표시와 같은 값)
    max-input-chars: 1000
    system-prompt: >-
      당신은 개발 및 기획 과제를 돕는 AI 어시스턴트입니다.
      사용자가 대화에 직접 붙여 넣은 내용만 볼 수 있습니다.
      한국어로 간결하고 정확하게 답하세요.

  # 채점: 서로 다른 회사 모델로 채점한다. calls 는 채점 1건에 그 모델을 부르는 횟수.
  # Haiku 1번 + terra 2번, 세 판정의 다수결(가운데 값)로 감점한다. 한 번씩만 부르면 엇갈릴 때 절반 감점이 되어 총점이 흔들린다(기술검증 3번).
  judge:
    claude:
      model: claude-haiku-5-5      # 비용 우선. 더 정확하게 보려면 claude-sonnet-5-5
      effort: medium               # Spring AI 1.1 에 옵션이 없어 요청에 직접 넣음 (AnthropicEffortInterceptor)
      max-tokens: 16000
    openai:
      model: gpt-6.1-terra
      effort: medium
      max-tokens: 16000
      calls: 2
    # 비개발 채점의 제공 자료: full(통째로) 또는 rag(제출물 문장으로 검색한 조각만, CSV 표는 통째로)
    reference-docs: ${PAIR_REFERENCE_DOCS:full}

  # (예비) Claude 를 어시스턴트로 쓸 때의 모델. 이번 파일럿에서는 쓰지 않는다.
  claude-assistant-model: claude-haiku-5-5

  # 응시자 코드 테스트 실행
  run:
    timeout-seconds: 30

  # 채점 툴 (메인 화면 오른쪽 위 아이콘). 프롬프트 버전과 샘플 응시는 grader/ 폴더로 git 공유.
  grader:
    dir: grader
    # 동시에 채점할 개수 (실제 응시 채점과 실험 채점이 함께 씀)
    parallel: 4

  # 모델 가격 ($/1M 토큰, 입력/출력). 채점 툴의 예상 비용 계산용
  pricing:
    "[gpt-6-luna]": { input: 0.10, output: 0.50 }
    "[gpt-6.1-terra]": { input: 1.0, output: 5.0 }
    "[gpt-6.1-sol]": { input: 2.0, output: 10.0 }
    "[claude-haiku-5-5]": { input: 0.10, output: 0.50 }
    "[claude-sonnet-5-5]": { input: 2.0, output: 10.0 }
