# 회차 통합 테스트: Docker 없이 H2(PostgreSQL 호환 모드) 메모리 DB 로 돈다.
# 운영 스키마(Flyway V1)의 부분 인덱스는 H2 가 못 읽어서, 테스트에서는 엔티티로 테이블을 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:exam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  # 테스트에서는 실제 AI 키를 쓰지 않는다. application.yml 이 application-secret.yml 을 읽어 와도 여기서 비운다.
  # (빌드할 때마다 과금되는 것을 막음. 실제 호출 테스트 TaskGenLiveTest 만 키를 다시 넣는다)
  ai:
    openai:
      api-key: ""
    anthropic:
      api-key: ""

pair:
  toss:
    expiration-enabled: false
    refund-recheck-enabled: false   # 환불 자동 재확인 주기 작업을 끈다(다른 테스트의 REFUNDING 행을 몰래 건드리지 않게). 동작은 recheckStaleRefunds 를 직접 불러 확인한다
  taskgen:
    worker:
      enabled: false   # 테스트는 대기열 워커를 끈다(작업을 서버가 몰래 줍지 않게). 워커 동작은 서비스의 tick() 을 직접 불러 확인한다
  # 기존 콘솔 인가 테스트는 개발용 사용자 헤더를 사용한다.
  auth:
    mode: header
    jwt:
      secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyaXRlbXMtbG9uZw==
    withdrawn-email:
      secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyaXRlbXMtbG9uZw==
  exam:
    scheduler-enabled: false
    # 감독관 실시간 보기 시그널링 테스트(ProctorRelayIntegrationTest)가 쓴다. 운영 기본값은 꺼짐
    live-view-enabled: true
