# 회차 통합 테스트: Docker 없이 H2(PostgreSQL 호환 모드) 메모리 DB 로 돈다.
# 운영 스키마(Flyway V1)의 부분 인덱스는 H2 가 못 읽어서, 테스트에서는 엔티티로 테이블을 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:exam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  # 테스트에서는 실제 AI 키를 쓰지 않는다. application.yml 이 application-secret.yml 을 읽어 와도 여기서 비운다.
  # (빌드할 때마다 과금되는 것을 막음. 실제 호출 테스트 TaskGenLiveTest 만 키를 다시 넣는다)
  ai:
    openai:
      api-key: ""
    anthropic:
      api-key: ""

pair:
  # 기존 콘솔 인가 테스트는 개발용 사용자 헤더를 사용한다.
  auth:
    mode: header
    jwt:
      secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LTMyaXRlbXMtbG9uZw==
  exam:
    scheduler-enabled: false
