# 운영 서버용 Compose. GHCR 에 올라간 이미지를 받아 실행한다 (개발용은 docker-compose.yml).
# 배포 워크플로(.github/workflows/deploy.yml)가 이 파일을 서버의 ~/pair/docker-compose.yml 로 복사하고,
# 같은 폴더에 application-secret.yml 을 만든 뒤 이 파일로 pull 과 up 을 한다. 손으로 쓸 때는 서버의 ~/pair 에서:
#   BACKEND_TAG=latest FRONTEND_TAG=latest docker compose pull && docker compose up -d
#
# - 외부에는 80·443 만 연다. 맨 앞의 Caddy 가 HTTPS 를 처리해 frontend 로 넘기고, 프론트 nginx 가 /api, /ws 를 같은 네트워크의 backend:8180 으로 넘긴다.
#   인증서(Let's Encrypt)는 Caddy 가 자동으로 받고 갱신하며, 80 요청은 https 로 보낸다. 도메인은 PAIR_DOMAIN (기본 kosamigo.duckdns.org).
#   조건: 도메인이 이 서버의 공인 IP(탄력적 IP)를 가리키고, 보안 그룹에서 80·443 이 전체(0.0.0.0/0)에 열려 있어야 인증서가 발급·갱신된다.
# - 백엔드 8180 은 호스트로 열지 않는다. 지표 포트 8181 은 이 서버 안(127.0.0.1)에서만 열어 배포 뒤 상태 확인에 쓴다.
# - 비밀번호·API 키는 이미지에 없고, 서버의 application-secret.yml 을 읽기 전용으로 붙인다.
# - 모니터링(Prometheus + Grafana)도 항상 같이 뜬다. 둘 다 이 서버 안(127.0.0.1)에서만 열린다. 내 PC 에서는 SSH 터널로 본다:
#     ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <사용자>@<서버>   →  Grafana http://localhost:3000, Prometheus http://localhost:9090
#   Grafana 관리자 비밀번호는 서버의 ~/pair/.env 의 GRAFANA_ADMIN_PASSWORD 로 넣는다 (배포 워크플로가 시크릿으로 만든다). 없으면 시작하지 않는다.
#   모니터링이 성능에 영향을 주면: docker compose stop prometheus grafana
# - Redis 는 채점 큐를 켤 때만 쓴다: docker compose --profile redis up -d (그리고 application-secret.yml 에 PAIR_SCORING_QUEUE_ENABLED: true, PAIR_REDIS_HOST: redis)
name: pair
services:
  backend:
    image: ghcr.io/kosamigo/pair-back:${BACKEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./application-secret.yml:/app/application-secret.yml:ro
      # 감독 사진·과제 파일을 로컬 저장소로 쓸 때(PAIR_SNAPSHOT_STORAGE=local, 기본)의 보관 폴더. S3 를 쓰면 비어 있다
      - ./data/pilot-data:/app/pilot-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ghcr.io/kosamigo/pair-front:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${PAIR_DOMAIN:-kosamigo.duckdns.org}", "--to", "frontend:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 받은 인증서를 보관한다. 지우면 매번 새로 발급받아 Let's Encrypt 발급 횟수 제한에 걸릴 수 있다
      - caddy-data:/data
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 디스크가 차지 않게 보관 기간과 크기를 제한한다
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 기본 비밀번호(admin)를 쓰지 않는다. 값이 없으면 compose 가 시작을 거부한다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 가 필요합니다 (서버의 ~/pair/.env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    # 재시작해도 대기 중인 채점 작업이 남도록 AOF 를 켠다
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  prometheus-data:
  grafana-data:
  redis-data:
