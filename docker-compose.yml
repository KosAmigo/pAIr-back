# 개발용 인프라: 초대 메일 확인용 SMTP(Mailpit). DB 는 AWS RDS 를 쓴다 (application-secret.yml)
#   docker compose up -d
#   메일함: http://localhost:8025
#
# 앱(백엔드 + 프론트)도 컨테이너로 돌리고 싶을 때만 같이 띄운다 (처음에는 이미지 빌드로 몇 분 걸린다):
#   docker compose --profile app up -d --build
#   화면: http://localhost:5173 (nginx 가 /api, /ws 를 백엔드로 넘긴다), 백엔드 직접: http://localhost:8180
#   pAIr-back/application-secret.yml 이 있어야 한다. pAIr-front 는 이 폴더 옆(../pAIr-front)에 있어야 한다.
#   IntelliJ·gradlew 로 백엔드를 이미 띄웠다면 8180 이 겹치니 먼저 끈다.
#
# 모니터링(Prometheus + Grafana)은 켜고 싶을 때만 같이 띄운다:
#   docker compose --profile monitoring up -d
#   Grafana: http://localhost:3000 (admin / admin, 개발 전용), Prometheus: http://localhost:9090
#   백엔드를 컨테이너(app 프로필)로 띄우든 내 PC 에서 직접 띄우든 지표를 읽어 간다
name: pair
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8180:8180"
      # 지표 포트(8181)는 호스트로 열지 않는다. 같은 compose 네트워크의 Prometheus 만 backend:8181 로 읽는다
    environment:
      # 메일 서버 등 나머지 설정은 호스트에서 gradlew 로 띄울 때와 같이 application-secret.yml 을 따른다
      # 초대 메일 링크가 컨테이너 안 주소가 아니라 브라우저로 여는 주소를 가리키게 한다
      PAIR_EXAM_ENTRY_BASE_URL: http://localhost:5173
      PAIR_COMPANY_INVITE_URL: http://localhost:5173/company-invite
    volumes:
      - ./application-secret.yml:/app/application-secret.yml:ro

  frontend:
    profiles: ["app"]
    build:
      context: ../pAIr-front/frontend
      dockerfile: ../../pAIr-back/docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
