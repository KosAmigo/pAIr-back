# 운영 서버용 Prometheus 설정 (docker-compose.prod.yml 의 prometheus). 같은 Compose 네트워크의 백엔드 지표 포트(8181)만 읽는다.
# 개발용은 prometheus.yml (내 PC 의 백엔드를 읽는 host.docker.internal 대상이 들어 있다).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pair-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8181"]
